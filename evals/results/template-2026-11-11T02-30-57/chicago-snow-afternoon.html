<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snow in Chicago</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Onest:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>:root{--bg:#fafafa;--fg:#0a0a0a;--muted:#5c5c5c;--accent:#d93f00;--accent-2:#0040e0;--surface:#f0f0f0;--line:#dcdcdc;color-scheme:light;--font-display:'Unbounded',sans-serif;--font-body:'Onest',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;--radius:18px;--gap:1.35}
@media (prefers-color-scheme:dark){:root{--bg:#13202b;--fg:#e8eef2;--muted:#9db0bf;--accent:#f4a261;--accent-2:#7dd3fc;--surface:#1a2a37;--line:#2a3d4d;color-scheme:dark;}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:18px;line-height:1.55;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.05;letter-spacing:-.01em;margin:0 0 calc(.5em*var(--gap));text-wrap:balance}
h1{font-size:clamp(34px,6.4vw,84px)}h2{font-size:clamp(24px,3.6vw,44px)}h3{font-size:clamp(18px,2.2vw,24px)}
p{margin:0 0 calc(1em*var(--gap));max-width:68ch;text-wrap:pretty}
a{color:var(--accent);text-underline-offset:.18em}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--fg);border-radius:var(--radius);padding:.55em 1em;cursor:pointer}
button:hover{background:var(--fg);color:var(--bg)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
input[type=range]{accent-color:var(--accent);width:100%}
table{border-collapse:collapse;width:100%}td,th{padding:.45em .6em;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.85em}
svg{max-width:100%;height:auto}canvas{max-width:100%;display:block}
img{max-width:100%}
.m-kicker{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 .9em}
.m-big{font-family:var(--font-display);font-size:clamp(56px,13vw,170px);line-height:.88;letter-spacing:-.03em;font-weight:700}
.m-lead{font-size:1.25em;line-height:1.4;max-width:40ch}
.m-muted{color:var(--muted)}.m-accent{color:var(--accent)}.m-accent-2{color:var(--accent-2)}
.m-mono{font-family:var(--font-mono)}
.m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:calc(16px*var(--gap))}
.m-row{display:flex;flex-wrap:wrap;gap:calc(12px*var(--gap));align-items:baseline}
.m-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:calc(18px*var(--gap))}
.m-stat{display:flex;flex-direction:column;gap:.2em}.m-stat b{font-family:var(--font-display);font-size:clamp(28px,4.6vw,52px);line-height:1;font-weight:700}
.m-rule{border:0;border-top:1px solid var(--line);margin:calc(24px*var(--gap)) 0}
.m-chip{display:inline-block;font-family:var(--font-mono);font-size:.78rem;padding:.25em .6em;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.m-list{list-style:none;padding:0;margin:0}.m-list li{padding:.6em 0;border-bottom:1px solid var(--line)}
.m-bars{display:flex;align-items:flex-end;gap:3px;height:120px}.m-bars i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px}
main>section{scroll-margin-top:16px}
main>section{animation:m-in .5s cubic-bezier(.2,.7,.2,1) both}@keyframes m-in{from{opacity:0;transform:translateY(18px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
#m-building{position:fixed;left:12px;bottom:12px;font-family:var(--font-mono);font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;z-index:5}
#m-building::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px;animation:m-pulse 1.2s ease-in-out infinite}
@keyframes m-pulse{50%{opacity:.25}}
.m-earlier{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line)}
main{padding:0}main>section{min-height:88vh;padding:clamp(28px,7vw,110px) clamp(16px,6vw,96px);display:flex;flex-direction:column;justify-content:center}main>section:nth-child(even){background:var(--surface)}</style>
<script>window.MOMENT={"live":"http://localhost:8788/live/41.88,-87.63","tz":"America/Chicago","place":"Chicago","eu":false};(()=>{const EU=false;let lastY=scrollY,lastT=performance.now(),speed=0,taps=0,idle=0,lastAct=performance.now(),hov=new Set(),bottom=false;
const desc=e=>{const el=e.closest&&e.closest('[data-m],button,a,svg,canvas,table,li,figure,h2,h3');if(!el)return null;return(el.getAttribute('data-m')||el.tagName.toLowerCase()+(el.className&&typeof el.className==='string'?'.'+el.className.split(' ')[0]:'')).slice(0,40)};
const act=()=>{lastAct=performance.now()};
addEventListener('scroll',()=>{const t=performance.now(),dy=Math.abs(scrollY-lastY);speed=.7*speed+.3*(dy/Math.max(16,t-lastT)*1000);lastY=scrollY;lastT=t;act();const b=innerHeight+scrollY>=document.documentElement.scrollHeight-40;if(b&&!bottom){bottom=true;parent.postMessage({type:'moment:bottom'},'*')}},{passive:true});
addEventListener('pointerover',e=>{if(EU)return;const d=desc(e.target);if(d&&hov.size<12)hov.add(d)},{passive:true});
addEventListener('pointerdown',()=>{taps++;act()},{passive:true});addEventListener('keydown',act);
const onScreen=()=>{let best=null,area=0;for(const s of document.querySelectorAll('main>section')){const r=s.getBoundingClientRect(),v=Math.max(0,Math.min(innerHeight,r.bottom)-Math.max(0,r.top));if(v>area){area=v;best=s.id||null}}return best};
setInterval(()=>{idle=performance.now()-lastAct;if(EU)return;parent.postMessage({type:'moment:interaction',section:onScreen(),scrollSpeed:Math.round(speed),hovered:[...hov],taps,idleMs:Math.round(idle),atBottom:bottom},'*');hov.clear();speed*=.5},2000);
})();</script>
</head><body class="layout-full-bleed motion-lively density-airy">
<div id="m-building" role="status">Writing this page</div>
<main>
<section id="scene" style="position:relative;min-height:92vh;padding:0;overflow:hidden"><canvas id="sky" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
<div style="position:relative;padding:clamp(20px,6vw,80px);min-height:92vh;display:flex;flex-direction:column;justify-content:flex-end"><p class="m-kicker">Tuesday · 3:20 p.m. · Chicago</p><h1>Snow in Chicago</h1><p class="m-lead">37°. Clearing after 10:00 p.m., 23° to 37°.</p></div></section>
<section id="soon"><h2>Soon</h2><p>Clearing after 10:00 p.m., 23° to 37°.</p><div class="m-bars" role="img" aria-label="Temperature over the next 12 hours"><i title="3 p.m.: 37°, 83% rain" style="height:91%;background:var(--accent-2)"></i><i title="4 p.m.: 36°, 89% rain" style="height:88%;background:var(--accent-2)"></i><i title="5 p.m.: 36°, 71% rain" style="height:86%;background:var(--accent-2)"></i><i title="6 p.m.: 35°, 75% rain" style="height:81%;background:var(--accent-2)"></i><i title="7 p.m.: 33°, 79% rain" style="height:72%;background:var(--accent-2)"></i><i title="8 p.m.: 32°, 95% rain" style="height:66%;background:var(--accent-2)"></i><i title="9 p.m.: 30°, 89% rain" style="height:58%;background:var(--accent-2)"></i><i title="10 p.m.: 28°, 12% rain" style="height:48%;"></i><i title="11 p.m.: 25°, 12% rain" style="height:32%;"></i><i title="midnight: 26°, 4% rain" style="height:36%;"></i><i title="1 a.m.: 24°, 11% rain" style="height:25%;"></i><i title="2 a.m.: 23°, 6% rain" style="height:19%;"></i></div>
<div class="m-row m-muted m-mono" style="justify-content:space-between;font-size:.75rem;margin-top:.4em"><span>3 p.m.</span><span>6 p.m.</span><span>9 p.m.</span><span>midnight</span></div><p class="m-kicker" style="margin-top:2.5em">Built by Moment's template engine from today's forecast, the sun and the calendar.</p></section>
</main>
<style>#m-building{display:none}</style>

<script>(()=>{try{
const cv=document.getElementById('sky'),x=cv.getContext('2d');const cs=getComputedStyle(document.documentElement);const fg=cs.getPropertyValue('--fg').trim(),ac=cs.getPropertyValue('--accent').trim();const kind="snow";const still=matchMedia('(prefers-reduced-motion: reduce)').matches||document.body.classList.contains('motion-still');let W,H,ps=[];const fit=()=>{const r=cv.getBoundingClientRect();W=cv.width=r.width*devicePixelRatio;H=cv.height=r.height*devicePixelRatio;const n=kind==='rain'?Math.round(W*H/9000):kind==='snow'?Math.round(W*H/16000):kind==='stars'?Math.round(W*H/7000):40;ps=Array.from({length:Math.min(n,900)},()=>({x:Math.random()*W,y:Math.random()*H,v:.5+Math.random(),r:Math.random()}))};fit();addEventListener('resize',fit);const draw=t=>{x.clearRect(0,0,W,H);if(kind==='haze'||kind==='fog'){for(const p of ps){x.globalAlpha=kind==='fog'?.05:.06;x.fillStyle=kind==='fog'?fg:ac;x.beginPath();x.arc((p.x+t*.01*p.v)%W,p.y,120*devicePixelRatio*(.5+p.r),0,7);x.fill()}}else if(kind==='stars'){for(const p of ps){x.globalAlpha=.25+.5*Math.abs(Math.sin(t/1400*p.v+p.r*9));x.fillStyle=fg;x.fillRect(p.x,p.y,1.4*devicePixelRatio,1.4*devicePixelRatio)}}else if(kind==='rain'){x.strokeStyle=fg;x.lineWidth=devicePixelRatio;for(const p of ps){x.globalAlpha=.15+.25*p.r;const y=(p.y+t*.6*p.v*devicePixelRatio)%H;x.beginPath();x.moveTo(p.x,y);x.lineTo(p.x-2*devicePixelRatio,y+14*devicePixelRatio*p.v);x.stroke()}}else{x.fillStyle=fg;for(const p of ps){x.globalAlpha=.35+.4*p.r;const y=(p.y+t*.05*p.v*devicePixelRatio)%H;x.beginPath();x.arc(p.x+Math.sin(t/900+p.r*6)*8,y,(1+p.r*2)*devicePixelRatio,0,7);x.fill()}}x.globalAlpha=1;if(!still)requestAnimationFrame(draw)};requestAnimationFrame(draw);
}catch(e){console.error('moment section script',e)}})();</script>
